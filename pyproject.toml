[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gussetline"
version = "0.1.0"
description = "Fare audit and reprice desk for an airfare consolidator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  "httpx==0.28.1",
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "pydantic==2.10.6",
  "uvicorn[standard]==0.34.0",
  "click==8.1.8",
]

[project.scripts]
gussetline = "gussetline.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  # The suite spends nearly all its time building sqlite schemas, and every
  # test file gets its own database, so it splits across cores almost
  # perfectly. Four minutes to fifty seconds on a six core machine.
  "pytest-xdist==3.6.1",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Split by file rather than by test. Nothing here shares state between files,
# and the per-file split keeps a failure reproducible with one path on the
# command line, which loadscope does not promise once it starts balancing.
addopts = "-q -n auto --dist loadfile"
filterwarnings = [
  # Starlette's test client still reaches for an anyio alias that anyio has
  # deprecated. Not ours to fix and not worth reading on every run.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
# Named rather than inferred. Coverage guesses from the first file it imports,
# and under xdist that is whichever worker started first, which is how a run
# ends up measuring the tests instead of the package.
source = ["gussetline"]
parallel = true
omit = [
  # A migration runs once against a real database and its downgrade runs
  # never. Counting them drags the figure around every time one is added and
  # says nothing about whether the desk works.
  "*/migrations/*",
]

[tool.coverage.report]
# Two decimal places, because the gate is at 95 and a run that reports 95%
# when it is at 94.6 has rounded its way past the thing it is there to catch.
precision = 2
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  # Imports that only exist for the type checker never run.
  "if TYPE_CHECKING:",
  # A module run directly. The CLI entry point is covered through the runner.
  'if __name__ == "__main__":',
  # An abstract method with no body is a declaration, not a branch.
  "raise NotImplementedError",
  "@overload",
]

[tool.ruff]
# The formatter and the linter share this. A hundred fits a fare construction
# line with its surcharge column, which is most of what gets read here.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["gussetline", "conftest"]

[tool.ruff.lint.per-file-ignores]
# A migration is a table definition column by column. One column per line is
# how it is read and how it is diffed, and wrapping the long ones makes it
# harder to see that a column is missing.
"migrations/versions/*" = ["E501"]
# env.py registers every table by star import, which is the whole point of it.
"migrations/env.py" = ["F401", "F403"]
# A test that an operator refuses has to evaluate the operator and nothing
# else. Binding the result to a throwaway name to quiet the linter makes the
# test read as if the value mattered, which is the opposite of the point.
"tests/*" = ["B015", "B018"]
# Routes declare their query parameters and bodies as call defaults. That is
# the framework's calling convention and there is no way to write it otherwise.
"src/gussetline/api/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
