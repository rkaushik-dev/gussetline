[build-system]
requires = ["setuptools>=75.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gussetline"
version = "0.1.0"
description = "Fare audit and reprice desk for an airfare consolidator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "rkaushik-dev" }]
dependencies = [
  "httpx==0.28.1",
  "SQLAlchemy==2.0.38",
  "alembic==1.14.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
# The formatter and the linter share this. A hundred fits a fare construction
# line with its surcharge column, which is most of what gets read here.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["gussetline", "conftest"]

[tool.ruff.lint.per-file-ignores]
# A test that an operator refuses has to evaluate the operator and nothing
# else. Binding the result to a throwaway name to quiet the linter makes the
# test read as if the value mattered, which is the opposite of the point.
"tests/*" = ["B015", "B018"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
