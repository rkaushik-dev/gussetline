# The service's own settings come from GUSSETLINE_* environment variables through Settings, and the
# settings, the database and the key ring are handed to the service when it starts. What is here is
# only how Spring itself should behave.
spring.application.name=gussetline
spring.main.banner-mode=off
server.error.whitelabel.enabled=false
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/openapi.json
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
